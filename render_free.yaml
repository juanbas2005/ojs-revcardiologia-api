# Render Blueprint — Bot OJS Telegram (TIER FREE con HTTP keep-alive)
# ===========================================================================
# Esta variante usa un Web Service en el plan FREE de Render.
# Render free se duerme tras 15 min sin requests HTTP, así que el web_server.py
# arranca el bot en un thread daemon + un HTTP server en $PORT.
# Para evitar el sleep, configura UptimeRobot (https://uptimerobot.com,
# gratis 50 monitores) para hacer ping a https://TU-APP.onrender.com/health
# cada 10 minutos.
#
# DESPLIEGUE:
#   1. En Render dashboard: New > Web Service > Build from this repo.
#   2. En "Blueprint", elige render_free.yaml (o renómbralo a render.yaml).
#   3. Plan: Free.
#   4. Tras deploy, copia la URL pública y agrégala a UptimeRobot.
# ===========================================================================
services:
  - type: web
    name: ojs-bot-telegram-free
    env: python
    region: oregon
    plan: free  # 512 MB RAM, se duerme tras 15 min sin HTTP
    buildCommand: pip install -r requirements.txt
    startCommand: python web_server.py
    autoDeploy: yes
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        value: "8484852335:AAEPpjUhD9ZCRmcHBIiAgZ1bzQftSKMElQs"
      - key: OJS_USER
        value: "riroennis"
      - key: OJS_PASS
        value: "Riroennis@2026"
      - key: OJS_PASS_REVCARD
        value: "Pupi@#1212"
      - key: OJS_JOURNAL
        value: "revcardiologia"
      - key: PART_MB
        value: "5"
      - key: IDLE_MIN
        value: "0"  # 0 = deshabilitado (el bot corre hasta que Render duerme el service)
