name: Bot Telegram (legacy, dispatch manual)

# Workflow original, mantenido para dispatch manual. El workflow principal
# con auto-restart está en bot_keepalive.yml.

on:
  workflow_dispatch: {}

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Arrancar bot (simple, polling)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OJS_USER: ${{ secrets.OJS_USER }}
          OJS_PASS: ${{ secrets.OJS_PASS }}
          OJS_PASS_REVCARD: ${{ secrets.OJS_PASS_REVCARD }}
          OJS_JOURNAL: revcardiologia
          PART_MB: "5"
          IDLE_MIN: "30"
        run: python bot_telegram_simple.py
