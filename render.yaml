# Render Blueprint — Bot OJS Telegram (Pyrogram)
# ===========================================================================
# DESPLIEGUE:
#   - El bot corre con Pyrogram (MTProto), soporta archivos de cualquier tamaño.
#   - startCommand: python bot_telegram.py
#   - Internamente arranca un HTTP server mínimo en $PORT para satisfacer
#     el health check de Render free (responde /health).
#
# PLAN:
#   - free: 512 MB RAM, se duerme tras 15 min sin HTTP. Bot funciona pero
#     se reconecta solo al despertar.
#   - starter: 24/7 real, sin sleep (requiere tarjeta).
# ===========================================================================
services:
  - type: web
    name: ojs-bot-telegram
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_telegram.py
    autoDeploy: yes
    healthCheckPath: /health
    envVars:
      # ---- Telegram (REQUERIDAS) ----
      - key: TELEGRAM_BOT_TOKEN
        value: "8484852335:AAEPpjUhD9ZCRmcHBIiAgZ1bzQftSKMElQs"
      - key: API_ID
        value: "14681595"
      - key: API_HASH
        value: "a86730aab5c59953c424abb4396d32d5"
      # ---- Credenciales OJS ----
      - key: OJS_USER
        value: "riroennis"
      - key: OJS_PASS
        value: "Riroennis@2026"
      - key: OJS_PASS_REVCARD
        value: "Pupi@#1212"
      # ---- Configuración ----
      - key: OJS_JOURNAL
        value: "revcardiologia"
      - key: PART_MB
        value: "5"
      - key: IDLE_MIN
        value: "0"   # 0 = 24/7 (no cerrar por inactividad)
